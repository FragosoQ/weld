<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const SHEET_CONFIG_DEFAULT = {
  id: '1GQUB52a2gKR429bjqJrNkbP5rjR7Z_4v85z9M7_Cr8Y',
  tab: 'PM1',
  keyHeader: null,
  keyValue: null,
  targetHeader: 'EVOLUÇÃO',
  targetColumn: 'Y',
};

// Cache system to avoid multiple fetches
let sheetCache = {};
let sheetCachePromises = {};

function getCacheKey(config) {
  const cfg = Object.assign({}, SHEET_CONFIG_DEFAULT, config);
  return `${cfg.id}|${cfg.tab}`;
}

function getSheetEndpoint(config) {
  const sheetId = encodeURIComponent(config.id);
  const sheetTab = encodeURIComponent(config.tab);
  // Com `range` (ex: 'L22:M26') pede só esse bloco de células, sem linha de cabeçalho.
  if (config.range) {
    return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetTab}&range=${encodeURIComponent(config.range)}&headers=0`;
  }
  return `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&sheet=${sheetTab}&headers=1`;
}

function parseGvizResponse(text) {
  const match = text.match(/google\.visualization\.Query\.setResponse\((.*)\);?$/s);
  if (!match) {
    throw new Error('Invalid Google Sheets response format');
  }
  return JSON.parse(match[1]);
}

function normalizeString(value) {
  return String(value || '').trim().normalize('NFC').toLowerCase();
}

function columnLetterToIndex(letter) {
  if (!letter) return -1;
  const normalized = String(letter).trim().toUpperCase();
  let index = 0;
  for (let i = 0; i < normalized.length; i += 1) {
    const charCode = normalized.charCodeAt(i);
    if (charCode < 65 || charCode > 90) {
      return -1;
    }
    index = index * 26 + (charCode - 65 + 1);
  }
  return index - 1;
}

function findSheetCell(table, headerLabel, fallbackColumn) {
  if (!table || !Array.isArray(table.cols)) {
    return -1;
  }

  // Prioritize column letter if provided
  if (fallbackColumn) {
    const fallbackIndex = columnLetterToIndex(fallbackColumn);
    if (fallbackIndex >= 0 && fallbackIndex < table.cols.length) {
      return fallbackIndex;
    }
  }

  // Fall back to header matching
  if (headerLabel) {
    const label = normalizeString(headerLabel);
    return table.cols.findIndex(col => normalizeString(col.label || col.id || '') === label);
  }

  return -1;
}

function getValueFromRow(row, index) {
  if (!row || !Array.isArray(row.c) || index < 0) {
    return null;
  }
  const cell = row.c[index];
  if (!cell) {
    return null;
  }
  return cell.v != null ? cell.v : (cell.f != null ? cell.f : null);
}

function findRowByKey(table, keyHeader, keyValue) {
  if (!Array.isArray(table.rows) || table.rows.length === 0) {
    return null;
  }
  if (keyHeader && keyValue) {
    const keyIndex = findSheetCell(table, keyHeader);
    if (keyIndex >= 0) {
      const found = table.rows.find(row => {
        const cellValue = getValueFromRow(row, keyIndex);
        return normalizeString(cellValue) === normalizeString(keyValue);
      });
      if (found) {
        return found;
      }
    }
  }
  return table.rows[0] || null;
}

function parseSheetPercentage(value) {
  if (value == null) {
    return null;
  }

  if (typeof value === 'number') {
    const pct = Math.abs(value) <= 1 ? value * 100 : value;
    return Math.round(pct);
  }

  const str = String(value).trim();
  const percentMatch = str.match(/^(-?\d+(?:[\.,]\d+)?)\s*%$/);
  if (percentMatch) {
    return Math.round(Number(percentMatch[1].replace(',', '.')));
  }

  const numericMatch = str.replace(/\s+/g, '').replace(',', '.').match(/(-?\d+(?:\.\d+)?)/);
  if (!numericMatch) {
    return null;
  }
  const numeric = Number(numericMatch[1]);
  const pct = numeric <= 1 ? numeric * 100 : numeric;
  return Math.round(pct);
}

function parseSheetDate(value) {
  if (value == null) {
    return null;
  }

  // Handle Google Sheets date format like "Date(2026,3,14)"
  const dateMatch = String(value).match(/Date\((\d+),(\d+),(\d+)\)/);
  if (dateMatch) {
    const year = parseInt(dateMatch[1]);
    const month = parseInt(dateMatch[2]); // 0-based in JS Date
    const day = parseInt(dateMatch[3]);
    const date = new Date(year, month, day);
    return date;
  }

  // Try to parse as regular date string
  const date = new Date(String(value));
  if (!isNaN(date.getTime())) {
    return date;
  }

  return null;
}

function formatSheetDate(value) {
  const date = parseSheetDate(value);
  if (!date) {
    return String(value);
  }
  return date.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function getDaysDiff(dateValue1, dateValue2) {
  const date1 = parseSheetDate(dateValue1);
  const date2 = parseSheetDate(dateValue2);
  
  if (!date1 || !date2) {
    return null;
  }

  // Reset time to midnight for accurate day difference
  date1.setHours(0, 0, 0, 0);
  date2.setHours(0, 0, 0, 0);

  return Math.floor((date2 - date1) / (1000 * 60 * 60 * 24));
}

async function fetchSheetTable(config) {
  const endpoint = getSheetEndpoint(config);
  const response = await fetch(endpoint, { cache: 'no-cache' });
  if (!response.ok) {
    throw new Error(`Sheet fetch failed: ${response.status} ${response.statusText}`);
  }
  const text = await response.text();
  const json = parseGvizResponse(text);
  if (!json || !json.table) {
    throw new Error('Sheet response did not contain table data');
  }
  return json.table;
}

function buildRowLookup(table, row) {
  const valuesByHeader = {};
  const valuesByColumn = {};

  if (!row || !Array.isArray(table.cols)) {
    return { valuesByHeader, valuesByColumn };
  }

  table.cols.forEach((col, index) => {
    const value = getValueFromRow(row, index);
    valuesByColumn[index] = value;

    const normalizedLabel = normalizeString(col.label || col.id || `col${index}`);
    valuesByHeader[normalizedLabel] = value;
  });

  return { valuesByHeader, valuesByColumn };
}

async function loadSheetDataCached(config = {}, options = {}) {
  const cfg = Object.assign({}, SHEET_CONFIG_DEFAULT, config);
  const cacheKey = getCacheKey(cfg);
  const forceReload = options.forceReload === true;

  if (!forceReload && sheetCache[cacheKey]) {
    return sheetCache[cacheKey];
  }

  if (!forceReload && sheetCachePromises[cacheKey]) {
    return await sheetCachePromises[cacheKey];
  }

  const promise = (async () => {
    const table = await fetchSheetTable(cfg);
    const row = findRowByKey(table, cfg.keyHeader, cfg.keyValue);
    if (!row) {
      throw new Error('No data row found in sheet');
    }

    const lookup = buildRowLookup(table, row);
    const result = { table, row, valuesByHeader: lookup.valuesByHeader, valuesByColumn: lookup.valuesByColumn };

    sheetCache[cacheKey] = result;
    delete sheetCachePromises[cacheKey];
    return result;
  })();

  sheetCachePromises[cacheKey] = promise;
  try {
    return await promise;
  } catch (error) {
    delete sheetCachePromises[cacheKey];
    throw error;
  }
}

async function loadSheetRow(config = {}) {
  const cached = await loadSheetDataCached(config);
  return cached;
}

function getSheetRowValue(rowData, targetHeader, targetColumn) {
  if (!rowData) {
    return null;
  }

  if (targetHeader) {
    const normalizedHeader = normalizeString(targetHeader);
    if (Object.prototype.hasOwnProperty.call(rowData.valuesByHeader, normalizedHeader)) {
      return rowData.valuesByHeader[normalizedHeader];
    }
  }

  if (targetColumn) {
    const index = columnLetterToIndex(targetColumn);
    if (index >= 0) {
      return rowData.valuesByColumn[index];
    }
  }

  return null;
}

async function loadSheetValue(config = {}) {
  const cfg = Object.assign({}, SHEET_CONFIG_DEFAULT, config);
  const cached = await loadSheetDataCached(cfg);

  return getSheetRowValue(cached, cfg.targetHeader, cfg.targetColumn);
}

function rowValuesSnapshot(rowData) {
  if (!rowData || !rowData.valuesByHeader) {
    return '';
  }
  const entries = Object.entries(rowData.valuesByHeader).sort(([a], [b]) => a.localeCompare(b));
  return JSON.stringify(entries);
}

// Watcher genérico de um separador inteiro: re-fetcha periodicamente e chama
// onChange sempre que o conteúdo da tabela mudar (snapshot por hash das células).
function watchSheetTab(config = {}, onChange, intervalMs = 20000) {
  const cfg = Object.assign({}, SHEET_CONFIG_DEFAULT, config);
  let lastSnapshot = null;
  let stopped = false;

  function tableSnapshot(table) {
    if (!table || !Array.isArray(table.rows)) return '';
    // Concatena valores brutos de todas as linhas/colunas
    const parts = [];
    for (let i = 0; i < table.rows.length; i += 1) {
      const row = table.rows[i];
      if (!row || !Array.isArray(row.c)) { parts.push(''); continue; }
      for (let j = 0; j < row.c.length; j += 1) {
        const cell = row.c[j];
        parts.push(cell ? (cell.v != null ? String(cell.v) : (cell.f != null ? String(cell.f) : '')) : '');
      }
      parts.push('|');
    }
    return parts.join(',');
  }

  async function check() {
    if (stopped) return;
    try {
      const table = await fetchSheetTable(cfg);
      const snapshot = tableSnapshot(table);
      if (snapshot !== lastSnapshot) {
        lastSnapshot = snapshot;
        onChange();
      }
    } catch (error) {
      console.warn(`Sheet watch error (${cfg.tab}):`, error);
    }
  }

  check();
  const intervalId = setInterval(check, intervalMs);
  return () => {
    stopped = true;
    clearInterval(intervalId);
  };
}

function watchSheetRow(config = {}, onChange, intervalMs = 20000) {
  let lastSnapshot = null;
  let stopped = false;

  async function check() {
    if (stopped) return;
    try {
      const cached = await loadSheetDataCached(config, { forceReload: true });
      const snapshot = rowValuesSnapshot(cached);
      if (snapshot !== lastSnapshot) {
        lastSnapshot = snapshot;
        onChange(cached);
      }
    } catch (error) {
      console.warn('Sheet watch error:', error);
    }
  }

  check();
  const intervalId = setInterval(check, intervalMs);
  return () => {
    stopped = true;
    clearInterval(intervalId);
  };
}

/**
 * Calcula dias úteis (segunda a sexta) entre duas datas em Portugal
 * @param {Date|String|Number} startDate - Data inicial
 * @param {Date|String|Number} endDate - Data final
 * @param {Boolean} includeStartDay - Se inclui o primeiro dia (padrão: true)
 * @param {Number} year - Ano para determinar feriados (padrão: ano da startDate)
 * @returns {Number} Número de dias úteis
 */
function getWorkDaysCount(startDate, endDate, includeStartDay = true, year = null) {
  const start = parseSheetDate(startDate);
  const end = parseSheetDate(endDate);
  
  if (!start || !end) {
    return null;
  }

  // Feriados nacionais em Portugal (formato: MM-DD)
  const ptHolidays = [
    '01-01', // Ano Novo
    '04-25', // Dia da Liberdade
    '05-01', // Dia do Trabalho
    '06-10', // Dia de Portugal
    '08-15', // Assunção
    '10-05', // Proclamação da República
    '11-01', // Dia de Todos os Santos
    '12-01', // Restauração da Independência
    '12-25', // Natal
  ];

  // Feriados móveis para 2026
  const mobileHolidays2026 = [
    '02-17', // Terça de Carnaval
    '04-17', // Sexta-feira Santa
  ];

  const year4Start = start.getFullYear();
  if (year === year4Start) {
    ptHolidays.push(...mobileHolidays2026);
  }

  const isHoliday = (date) => {
    const monthDay = String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
    return ptHolidays.includes(monthDay);
  };

  const isWorkDay = (date) => {
    const dayOfWeek = date.getDay();
    // 0 = domingo, 1 = segunda, ..., 5 = sexta, 6 = sábado
    return dayOfWeek >= 1 && dayOfWeek <= 5 && !isHoliday(date);
  };

  let count = 0;
  const current = new Date(start);
  current.setHours(0, 0, 0, 0);
  end.setHours(0, 0, 0, 0);

  // Ajestar se não inclui o dia de início
  if (!includeStartDay) {
    current.setDate(current.getDate() + 1);
  }

  while (current <= end) {
    if (isWorkDay(current)) {
      count++;
    }
    current.setDate(current.getDate() + 1);
  }

  return count;
}

function parseSheetTime(value) {
  if (value == null || String(value).trim() === '') {
    return null;
  }

  if (typeof value === 'number' && Number.isFinite(value)) {
    return value >= 0 && value < 1 ? value * 24 * 60 : null;
  }

  const text = String(value).trim();
  const dateMatch = text.match(/^Date\(\d+,\d+,\d+(?:,(\d+),(\d+),(\d+))?\)$/);
  const timeMatch = text.match(/(?:^|T)(\d{1,2}):(\d{2})(?::(\d{2}))?/);
  let hours;
  let minutes;
  let seconds;

  if (dateMatch) {
    hours = Number(dateMatch[1] || 0);
    minutes = Number(dateMatch[2] || 0);
    seconds = Number(dateMatch[3] || 0);
  } else if (timeMatch) {
    hours = Number(timeMatch[1]);
    minutes = Number(timeMatch[2]);
    seconds = Number(timeMatch[3] || 0);
  } else {
    return null;
  }

  if (hours > 23 || minutes > 59 || seconds > 59) {
    return null;
  }
  return hours * 60 + minutes + seconds / 60;
}

function getShiftHoursBetween(startMinutes, endMinutes) {
  const workPeriods = [[8 * 60, 12 * 60], [13 * 60, 17 * 60]];
  return workPeriods.reduce((total, [periodStart, periodEnd]) => {
    return total + Math.max(0, Math.min(endMinutes, periodEnd) - Math.max(startMinutes, periodStart));
  }, 0) / 60;
}

function getDeadlineHours(startDate, dueDate, startTime, now = new Date()) {
  const start = parseSheetDate(startDate);
  const due = parseSheetDate(dueDate);
  const startMinutes = parseSheetTime(startTime);
  if (!start || !due || startMinutes == null) {
    return null;
  }

  start.setHours(0, 0, 0, 0);
  due.setHours(0, 0, 0, 0);
  if (due < start) {
    return { elapsed: 0, total: 0 };
  }

  const currentTime = new Date(now);
  const today = new Date(currentTime);
  today.setHours(0, 0, 0, 0);
  const nowMinutes = currentTime.getHours() * 60 + currentTime.getMinutes() + currentTime.getSeconds() / 60;
  let elapsed = 0;
  let total = 0;

  for (const day = new Date(start); day <= due; day.setDate(day.getDate() + 1)) {
    if (getWorkDaysCount(day, day, true, start.getFullYear()) !== 1) {
      continue;
    }

    const isStartDay = day.getTime() === start.getTime();
    total += getShiftHoursBetween(isStartDay ? startMinutes : 0, 17 * 60);

    if (day < today) {
      elapsed += getShiftHoursBetween(isStartDay ? startMinutes : 0, 17 * 60);
    } else if (day.getTime() === today.getTime()) {
      elapsed += getShiftHoursBetween(isStartDay ? startMinutes : 0, nowMinutes);
    }
  }

  return { elapsed: Math.min(elapsed, total), total };
}

function formatWorkHours(hours) {
  return (Math.round(hours * 10) / 10).toLocaleString('pt-PT', { maximumFractionDigits: 1 });
}

/**
 * Retorna informações de prazo com dias úteis
 * @param {Date|String|Number} startDate - Data de início
 * @param {Date|String|Number} dueDate - Data prevista
 * @param {Date|String|Number} todayDate - Data atual (padrão: hoje)
 * @returns {Object} { totalWorkDays, remainingWorkDays, percentage }
 */
function getDeadlineInfo(startDate, dueDate, todayDate = new Date()) {
  const start = parseSheetDate(startDate);
  const due = parseSheetDate(dueDate);
  const today = parseSheetDate(todayDate);
  
  if (!start || !due || !today) {
    return null;
  }

  const totalWorkDays = getWorkDaysCount(start, due, true, start.getFullYear());
  const remainingWorkDays = getWorkDaysCount(today, due, false, today.getFullYear());
  
  return {
    totalWorkDays,
    remainingWorkDays,
    daysElapsed: totalWorkDays - remainingWorkDays,
    percentage: totalWorkDays > 0 ? Math.round(((totalWorkDays - remainingWorkDays) / totalWorkDays) * 100) : 0
  };
}

/**
 * Retorna o emoji da bandeira baseado no nome do país
 * @param {String} countryName - Nome do país
 * @returns {String} Emoji da bandeira ou 🇺🇳 se não encontrado
 */
function getCountryFlag(countryName) {
  if (!countryName || typeof countryName !== 'string') {
    return '🇺🇳'; // United Nations flag as fallback
  }

  const country = countryName.trim().toLowerCase();

  // Mapeamento de países para códigos ISO de 2 letras
  const countryMap = {
    'portugal': 'PT',
    'portuguesa': 'PT',
    'espanha': 'ES',
    'spain': 'ES',
    'frança': 'FR',
    'france': 'FR',
    'itália': 'IT',
    'italy': 'IT',
    'alemanha': 'DE',

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Promises in-flight de fetch a separadores secundários, para de-dupe no mesmo tick.
const SECONDARY_TAB_INFLIGHT = {};

function fetchSecondaryTable(tab) {
  if (!SECONDARY_TAB_INFLIGHT[tab]) {
    SECONDARY_TAB_INFLIGHT[tab] = fetchSheetTable({ id: SHEET_CONFIG_DEFAULT.id, tab })
      .finally(() => { delete SECONDARY_TAB_INFLIGHT[tab]; });
  }
  return SECONDARY_TAB_INFLIGHT[tab];
}

// Vai buscar a linha 2 (primeira linha de dados) de um separador e devolve os
// campos pedidos como { [chave]: valor }. Cada campo é { header, column }.
// Faz de-dupe se já existe um fetch em curso para o mesmo separador.
async function fetchSecondaryRowFields(tab, fields) {
  const table = await fetchSecondaryTable(tab);
  const out = {};
  if (!table || !Array.isArray(table.rows) || !table.rows[0]) {
    return out;
  }
  const firstRow = table.rows[0];
  Object.keys(fields).forEach(key => {
    const { header, column } = fields[key];
    const idx = findSheetCell(table, header, column);
    out[key] = idx >= 0 ? getValueFromRow(firstRow, idx) : null;
  });
  return out;
}

// Lê valores de várias colunas em várias linhas de um separador.
// `columns` é um objecto { chave: { header, column } } a definir as colunas pretendidas.
// `startRow`/`endRow` são números de linha 1-indexed da Sheet (linha 1 = cabeçalho).
// Devolve um array de objectos, um por linha de dados, com as chaves pedidas.
//
// Nota técnica: o gviz com headers=1 desloca os índices — a linha 2 da Sheet
// corresponde a rows[0], a linha 3 a rows[1], etc. Esta função abstrai isso.
async function fetchSecondaryRowsRange(tab, columns, startRow, endRow) {
  const table = await fetchSecondaryTable(tab);
  if (!table || !Array.isArray(table.rows)) return [];

  // Resolver o índice de cada coluna uma vez
  const resolved = {};
  Object.keys(columns).forEach(key => {
    const { header, column } = columns[key];
    resolved[key] = findSheetCell(table, header, column);
  });

  // Linha N (1-indexed) da Sheet → rows[N-2] no gviz (porque rows[0] = linha 2)
  const startIdx = Math.max(0, startRow - 2);
  const endIdx = Math.min(table.rows.length - 1, endRow - 2);

  const out = [];
  for (let i = startIdx; i <= endIdx; i += 1) {
    const row = table.rows[i];
    if (!row) continue;
    const obj = {};
    Object.keys(resolved).forEach(key => {
      const idx = resolved[key];
      obj[key] = idx >= 0 ? getValueFromRow(row, idx) : null;
    });
    out.push(obj);
  }
  return out;
}

// Vai buscar valores de uma coluna do separador `tab` para alimentar um card-lista.
//
// Modo "column" (default): lê primeiras N linhas da coluna `column` (ou pelo `header`).
// Modo "row-headers": lê os labels do cabeçalho (linha 1) das colunas entre
// `startColumn` e `endColumn`, e devolve só aqueles cuja célula da linha 2
// não está vazia. Útil para mostrar "que postos estão activos agora".
async function fetchZonaListValues(source) {
  const cfg = {
    id: SHEET_CONFIG_DEFAULT.id,
    tab: source.tab,
  };
  const table = await fetchSheetTable(cfg);

  if (source.mode === 'row-headers') {
    if (!table || !Array.isArray(table.cols) || !Array.isArray(table.rows) || !table.rows[0]) {
      return [];
    }
    const startIdx = columnLetterToIndex(source.startColumn);
    const endIdx = columnLetterToIndex(source.endColumn);
    if (startIdx < 0 || endIdx < 0 || endIdx < startIdx) {
      return [];
    }
    const ignore = new Set((source.ignoreLabels || []).map(s => String(s).trim()));
    const firstRow = table.rows[0]; // linha 2 da Sheet (gviz com headers=1 desloca)
    const limit = Math.max(1, source.limit || 50);
    const labelAt = (idx) => {
      const col = table.cols[idx] || {};
      return col.label != null && String(col.label).trim() !== ''
        ? String(col.label).trim()
        : String(col.id || '').trim();
    };

    // percentLabel: colunas em pares [Posto | %]. Mostra o cabeçalho do posto
    // quando a célula da linha 2 na coluna "%" ao lado vale 100%.
    if (source.percentLabel) {
      const pctLabel = String(source.percentLabel).trim();
      const isFull = (value) => {
        if (value == null) return false;
        if (typeof value === 'number') return value === 1 || value === 100;
        const s = String(value).trim().replace(',', '.');
        if (s === '') return false;
        const num = s.endsWith('%') ? Number(s.slice(0, -1)) / 100 : Number(s);
        return num === 1 || num === 100;
      };
      const values = [];
      for (let i = startIdx + 1; i <= endIdx && i < table.cols.length && values.length < limit; i += 1) {
        if (labelAt(i) !== pctLabel) continue;
        if (!isFull(getValueFromRow(firstRow, i))) continue;
        const label = labelAt(i - 1);
        if (label === '' || label === pctLabel) continue;
        values.push(label);
      }
      return values;
    }
    // matchValue: se definido, só mostra colunas cuja célula da linha 2
    // tenha esse valor exacto.
    const matchValue = source.matchValue;
    const hasMatchFilter = matchValue !== undefined && matchValue !== null;
    const values = [];
    for (let i = startIdx; i <= endIdx && i < table.cols.length && values.length < limit; i += 1) {
      const value = getValueFromRow(firstRow, i);
      if (value == null || String(value).trim() === '') continue;

      if (hasMatchFilter) {
        const num = typeof value === 'number'
          ? value
          : Number(String(value).trim().replace(',', '.'));
        if (!Number.isFinite(num) || num !== Number(matchValue)) continue;
      }

      const col = table.cols[i] || {};
      const rawLabel = col.label != null && String(col.label).trim() !== ''
        ? String(col.label).trim()
        : String(col.id || '').trim();
      if (rawLabel === '' || ignore.has(rawLabel)) continue;

      values.push(source.replaceDots ? rawLabel.replace(/\./g, '_') : rawLabel);
    }
    return values;
  }

  // Modo default: percorre as primeiras linhas de uma única coluna
  // Modo default: percorre as primeiras linhas de uma única coluna.
  // Se `dimColumn`/`dimHeader` for fornecido, cada item vem como { value, dim }
  // onde dim=true se a célula da coluna de "dim" nessa mesma linha não estiver vazia.
  const colIndex = findSheetCell(table, source.header, source.column);
  if (colIndex < 0 || !Array.isArray(table.rows)) {
    return [];
  }
  const dimColIndex = (source.dimColumn || source.dimHeader)
    ? findSheetCell(table, source.dimHeader, source.dimColumn)
    : -1;
  const limit = Math.max(1, source.limit || 5);
  const values = [];
  for (let i = 0; i < table.rows.length && values.length < limit; i += 1) {
    const v = getValueFromRow(table.rows[i], colIndex);
    if (v != null && String(v).trim() !== '') {
      const item = { value: String(v).trim(), dim: false };
      if (dimColIndex >= 0) {
        const dimVal = getValueFromRow(table.rows[i], dimColIndex);
        item.dim = dimVal != null && String(dimVal).trim() !== '';
      }
      values.push(item);
    }
  }
  return values;
}

function buildZonaPctCard(config, rowData) {
  // Suporta dois modos:
  //   1) rowData é a linha completa do PM1 → vai buscar via getFieldValue
  //   2) rowData = { __raw: valor } → usa o valor directamente (cards lidos de separadores externos)
  let raw;
  if (rowData && Object.prototype.hasOwnProperty.call(rowData, '__raw')) {
    raw = rowData.__raw;
  } else {
    raw = getFieldValue(rowData, config.header, config.column, 0);
  }
  const pct = parseSheetPercentage(raw) || 0;
  const cls = pct === 100 ? 'done' : pct > 0 ? 'going' : 'empty';
  const col = bc(pct);
  const card = document.createElement('div');
  card.className = `zona-card ${cls}${config.tall ? ' tall' : ''}`;
  card.innerHTML = `
    <div class="zona-card-label">${escapeHtml(config.nome)}</div>
    <div class="zona-card-pct" style="color:${col || 'rgba(255,255,255,0.15)'}">${pct}%</div>
    <div class="zona-card-bar">
      <div class="zona-card-fill" style="width:${pct}%;background:${col || 'rgba(255,255,255,0.07)'}"></div>
    </div>`;
  return card;
}

function buildZonaListCard(config, items) {
  const list = Array.isArray(items) ? items : [];
  const cls = list.length > 0 ? 'going' : 'empty';
  const card = document.createElement('div');
  card.className = `zona-card list ${cls}${config.tall ? ' tall' : ''}`;

  // Cada item pode ser uma string (modo simples) ou um objecto { value, dim }
  // (quando há coluna auxiliar a controlar o "esbatido").
  const itemsHtml = list.length
    ? list.map(item => {
        const text = (item && typeof item === 'object') ? item.value : item;
        const dim = !!(item && typeof item === 'object' && item.dim);
        return `<div class="zona-card-list-item${dim ? ' dim' : ''}">${escapeHtml(text)}</div>`;
      }).join('')
    : '<div class="zona-card-list-empty">Sem dados</div>';

  const src = config.listSource || {};
  const headerLabel = src.headerLabel || src.header || 'LOTE';
  const headerHtml = src.hideHeader
    ? ''
    : `<div class="zona-card-list-header">${escapeHtml(headerLabel)}</div>`;

  // Layout em grid (ex: Histórico em 3×4 fluxo coluna-a-coluna)
  let itemsClass = 'zona-card-list-items';
  let itemsStyle = '';
  if (src.gridLayout) {
    const { cols = 3, rows = 4, flow = 'row' } = src.gridLayout;
    itemsClass += ' is-grid-list';
    itemsStyle = ` style="--grid-cols:${cols};--grid-rows:${rows};grid-auto-flow:${flow === 'column' ? 'column' : 'row'};"`;
  }

  card.innerHTML = `
    <div class="zona-card-label">${escapeHtml(config.nome)}</div>
    ${headerHtml}
    <div class="${itemsClass}"${itemsStyle}>${itemsHtml}</div>`;
  return card;
}

function buildZonaSingleCard(config, value) {
  const txt = value != null && String(value).trim() !== '' ? String(value).trim() : null;
  const cls = txt ? 'going' : 'empty';
  const card = document.createElement('div');
  card.className = `zona-card single ${cls}${config.tall ? ' tall' : ''}`;
  card.innerHTML = `
    <div class="zona-card-label">${escapeHtml(config.nome)}</div>
    <div class="zona-card-single-value">${escapeHtml(txt || '—')}</div>`;
  return card;
}

function renderZones(rowData) {
  zg.innerHTML = '';
  ZONA_CONFIGS.forEach(config => {
    if (config.type === 'list') {
      const src = config.listSource || {};
      const cacheKey = src.mode === 'row-headers'
        ? `list|${src.tab}|rowheaders|${src.startColumn}-${src.endColumn}`
        : `list|${src.tab}|${src.column || src.header}`;
      const cached = ZONA_LIST_CACHE[cacheKey];
      const card = buildZonaListCard(config, cached);
      zg.appendChild(card);

      fetchZonaListValues(src)
        .then(values => {
          ZONA_LIST_CACHE[cacheKey] = values;
          const fresh = buildZonaListCard(config, values);
          card.replaceWith(fresh);
          applyActiveHighlight();
        })
        .catch(err => console.warn(`Falha a carregar lista para "${config.nome}":`, err));
    } else if (config.type === 'single') {
      const src = config.singleSource || {};
      const cacheKey = `single|${src.tab}|${src.column || src.header}`;
      const cached = ZONA_LIST_CACHE[cacheKey];
      const card = buildZonaSingleCard(config, cached);
      zg.appendChild(card);

      fetchSecondaryRowFields(src.tab, {
        v: { header: src.header, column: src.column },
      }).then(({ v }) => {
        ZONA_LIST_CACHE[cacheKey] = v;
        const fresh = buildZonaSingleCard(config, v);
        card.replaceWith(fresh);
      }).catch(err => console.warn(`Falha a carregar valor para "${config.nome}":`, err));
    } else if (config.tab) {
      // Card percentual lido de um separador específico (ex: PS2)
      const cacheKey = `pct|${config.tab}|${config.column || config.header}`;
      const cached = ZONA_LIST_CACHE[cacheKey];
      // Render imediato com o que está em cache (evita pisca)
      const card = buildZonaPctCard(config, cached != null ? { __raw: cached } : null);
      zg.appendChild(card);

      fetchSecondaryRowFields(config.tab, {
        v: { header: config.header, column: config.column },
      }).then(({ v }) => {
        ZONA_LIST_CACHE[cacheKey] = v;
        // Constrói card fresco com o valor recebido
        const fresh = buildZonaPctCard(config, { __raw: v });
        card.replaceWith(fresh);
      }).catch(err => console.warn(`Falha a carregar pct para "${config.nome}":`, err));
    } else {
      zg.appendChild(buildZonaPctCard(config, rowData));
    }
  });
  // Aplica o destaque a quaisquer cartas-lista renderizadas a partir da cache
  applyActiveHighlight();
}

function renderDeadlineHours() {
  const hoursInfo = deadlineHoursInput
    ? getDeadlineHours(deadlineHoursInput.start, deadlineHoursInput.due, deadlineHoursInput.time)
    : null;
  const hasHours = Boolean(hoursInfo && hoursInfo.total > 0);

  if (prazoHoursEl) {
    prazoHoursEl.hidden = !hasHours;
  }
  if (!prazoHoursBarEl) {
    return;
  }
  if (!hasHours) {
    prazoHoursBarEl.style.width = '0%';
    prazoHoursBarEl.setAttribute('aria-valuenow', '0');
    prazoHoursBarEl.setAttribute('aria-valuemax', '0');
    prazoHoursBarEl.setAttribute('aria-valuetext', 'Sem horas úteis disponíveis');
    return;
  }

  const ratio = Math.min(1, hoursInfo.elapsed / hoursInfo.total);
  const color = ratio >= .9 ? '#ff3b3b' : ratio >= .7 ? '#ffaa00' : '#00ff87';
  prazoHoursBarEl.style.width = `${ratio * 100}%`;
  prazoHoursBarEl.style.background = color;
  prazoHoursBarEl.setAttribute('aria-valuemin', '0');
  prazoHoursBarEl.setAttribute('aria-valuemax', String(hoursInfo.total));
  prazoHoursBarEl.setAttribute('aria-valuenow', String(hoursInfo.elapsed));
  prazoHoursBarEl.setAttribute('aria-valuetext', `${formatWorkHours(hoursInfo.elapsed)} de ${formatWorkHours(hoursInfo.total)} horas úteis`);
}

setInterval(renderDeadlineHours, 60 * 1000);

function updateDeadline(startValue, dueValue, startTimeValue) {
  // Helper: limpa o bloco de prazo para o estado "sem dados"
  const clearDeadline = () => {
    const dash = '-';
    if (prazoUsedEl) {
      prazoUsedEl.textContent = dash;
      prazoUsedEl.style.color = 'rgba(255,255,255,0.4)';
      prazoUsedEl.style.textShadow = 'none';
    }
    if (prazoTotalEl) {
      prazoTotalEl.textContent = dash;
    }
    const unitEl = document.querySelector('.prazo-unit');
    if (unitEl) {
      unitEl.textContent = 'DIAS';
    }
    if (prazoBarEl) {
      prazoBarEl.style.width = '0%';
      prazoBarEl.style.background = 'rgba(255,255,255,0.15)';
    }
    if (prazoHoursEl) {
      prazoHoursEl.hidden = true;
    }
    deadlineHoursInput = null;
    renderDeadlineHours();
    if (folgaEl) {
      folgaEl.textContent = '—';
      folgaEl.style.color = 'rgba(255,255,255,0.4)';
    }
  };

  if (startValue == null || String(startValue).trim() === '' ||
      dueValue == null || String(dueValue).trim() === '') {
    clearDeadline();
    return;
  }

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const total = getWorkDaysCount(startValue, dueValue, true);
  const used = getWorkDaysCount(startValue, today, true);
  const remaining = getWorkDaysCount(today, dueValue, false);

  if (total == null || used == null || remaining == null) {
    clearDeadline();
    return;
  }

  const ratio = total > 0 ? Math.min(1, used / total) : 0;
  const isOverdue = used > total;
  const pc = isOverdue ? '#ff3b3b' : ratio >= .7 ? '#ffaa00' : '#00ff87';

  if (prazoUsedEl) {
    prazoUsedEl.textContent = used;
    prazoUsedEl.style.color = pc;
    prazoUsedEl.style.textShadow = `0 0 40px ${pc}50`;
  }
  if (prazoBarEl) {
    prazoBarEl.style.width = `${ratio * 100}%`;
    prazoBarEl.style.background = pc;
  }
  deadlineHoursInput = { start: startValue, due: dueValue, time: startTimeValue };
  renderDeadlineHours();
  if (folgaEl) {
    folgaEl.textContent = `${remaining} dias restantes`;
    folgaEl.style.color = isOverdue ? '#ff3b3b' : remaining <= 3 ? '#ffaa00' : '#00ff87';
  }
  if (prazoTotalEl) {
    prazoTotalEl.textContent = total;
  }
  const unitEl = document.querySelector('.prazo-unit');
  if (unitEl) {
    unitEl.textContent = 'dias';
  }
}

function updateStatus(chaveValue) {
  if (!statusEl) return;
  const hasValue = chaveValue != null && String(chaveValue).trim().length > 0;
  statusEl.textContent = hasValue ? 'EM CURSO · ON' : 'STANDBY';
}

/* ── PAÍSES (montagemEditável!L22:M26) ── */
const PAIS_PLACEHOLDER = '- · -';
// Lido por range explícito: o gviz omite linhas vazias quando se pede o separador
// inteiro, pelo que o índice da linha deixa de corresponder ao número da linha na Sheet.
const PAIS_RANGE = { tab: 'montagemEditável', range: 'L22:M26' };

function setPaisEmpty() {
  if (!paisContainerEl) return;
  paisContainerEl.classList.remove('is-grid');
  paisContainerEl.innerHTML = `
    <span class="id-flag"></span>
    <span class="id-pais-info">${modelDataAvailable ? PAIS_PLACEHOLDER : '--'}</span>`;
}

function setPaisSingle(pais, idioma) {
  if (!paisContainerEl) return;
  if (!modelDataAvailable) { setPaisEmpty(); return; }
  paisContainerEl.classList.remove('is-grid');
  const flag = getCountryFlag(pais) || '';
  const idiomaTxt = idioma ? idioma.toUpperCase() : '—';
  paisContainerEl.innerHTML = `
    <span class="id-flag">${escapeHtml(flag)}</span>
    <span class="id-pais-info">${escapeHtml(pais.toUpperCase())} · ${escapeHtml(idiomaTxt)}</span>`;
}

function setPaisGrid(pares) {
  if (!paisContainerEl) return;
  if (!modelDataAvailable) { setPaisEmpty(); return; }
  paisContainerEl.classList.add('is-grid');
  paisContainerEl.innerHTML = pares.map(p => {
    const flag = getCountryFlag(p.pais) || '';
    const idiomaTxt = p.idioma ? p.idioma.toUpperCase() : '—';
    return `
      <div class="id-pais-cell">
        <span class="id-flag">${escapeHtml(flag)}</span>
        <span class="id-pais-info">${escapeHtml(p.pais.toUpperCase())} · ${escapeHtml(idiomaTxt)}</span>
      </div>`;
  }).join('');
}

function loadAndRenderPaises() {
  return fetchSheetTable({ id: SHEET_CONFIG_DEFAULT.id, ...PAIS_RANGE }).then(table => {
    const rows = table && Array.isArray(table.rows) ? table.rows : [];
    const cellText = (row, idx) => {
      const value = getValueFromRow(row, idx);
      return value != null ? String(value).trim() : '';
    };
    // Coluna 0 = L (país), coluna 1 = M (idioma)
    const valid = rows
      .map(row => ({ pais: cellText(row, 0), idioma: cellText(row, 1) }))
      .filter(r => r.pais !== '');

    if (valid.length === 0) {
      setPaisEmpty();
      if (typeof updateGlobeDestinations === 'function') {
        updateGlobeDestinations([]);
      }
      return;
    }

    // Ordenação alfabética pelo nome do país (locale PT, insensível a acentos/maiúsculas)
    valid.sort((a, b) => a.pais.localeCompare(b.pais, 'pt', { sensitivity: 'base' }));

    if (valid.length === 1) {
      setPaisSingle(valid[0].pais, valid[0].idioma);
    } else {
      setPaisGrid(valid);
    }

    // Marcar todos os países no globo (Portugal mantém-se sempre como origem)
    if (typeof updateGlobeDestinations === 'function') {
      updateGlobeDestinations(valid.map(r => r.pais));
    }
  }).catch(err => {
    console.warn('Falha a carregar países do montagemEditável:', err);
    setPaisEmpty();
    if (typeof updateGlobeDestinations === 'function') {
      updateGlobeDestinations([]);
    }
  });
}

// Modelo/Lote (PS2!D2), Início (PS2!J2), Previsto (PS2!F2) e estado (PS2!A2).
function refreshPs2Details() {
  const DATE_PLACEHOLDER = '-- / -- / ----';
  const MODEL_PLACEHOLDER = '—';

  // Separa "MWS500 SDS - 87L" → { modelo: "MWS500 SDS", lote: "87L" }.
  // Se não terminar em "<2 dígitos>L", devolve { modelo: <string toda>, lote: null }.
  function parseModeloLote(raw) {
    const text = raw == null ? '' : String(raw).trim();
    if (text === '' || /^[-–—]+$/.test(text)) return { modelo: '', lote: null };
    // Padrão: começa pela parte do modelo, segue " - " (espaços flexíveis), 2 dígitos + L no fim
    const m = text.match(/^(.*?)\s*-\s*(\d{2}L)$/);
    if (m) {
      return { modelo: m[1].trim(), lote: m[2] };
    }
    return { modelo: text, lote: null };
  }

  return fetchSecondaryRowFields('PS2', {
    inicio: { header: 'INÍCIO SOLDADURA / ACABAMENTO', column: 'J' },
    inicioHora: { column: 'DW' },
    previsto: { header: 'DATA PRETENDIDA', column: 'F' },
    modeloLote: { header: 'LOTE', column: 'D' },
    chaveProcura: { header: 'Chave de Procura', column: 'A' },
  }).then(({ inicio, inicioHora, previsto, modeloLote, chaveProcura }) => {
    const inicioFmt = inicio != null && String(inicio).trim() !== ''
      ? formatSheetDate(inicio) || DATE_PLACEHOLDER
      : DATE_PLACEHOLDER;
    const previstoFmt = previsto != null && String(previsto).trim() !== ''
      ? formatSheetDate(previsto) || DATE_PLACEHOLDER
      : DATE_PLACEHOLDER;
    renderText(dataInicioEl, inicioFmt, DATE_PLACEHOLDER);
    renderText(dataPrevistaEl, previstoFmt, DATE_PLACEHOLDER);
    updateDeadline(inicio, previsto, inicioHora);

    const { modelo, lote } = parseModeloLote(modeloLote);
    modelDataAvailable = Boolean(modelo);
    renderText(modelEl, modelo || MODEL_PLACEHOLDER, MODEL_PLACEHOLDER);
    loadAndRenderPaises();
    if (loteEl) {
      loteEl.innerHTML = lote
        ? `Lote &nbsp;·&nbsp; ${escapeHtml(lote)}`
        : 'Sem Lote';
    }
    // Actualiza referência usada pelas listas para destacar o item activo
    currentModeloLote = (modelo && lote) ? `${modelo} - ${lote}` : null;
    applyActiveHighlight();

    updateStatus(chaveProcura);
  }).catch(err => {
    console.warn('Falha a carregar dados do PS2:', err);
    modelDataAvailable = false;
    loadAndRenderPaises();
    renderText(dataInicioEl, DATE_PLACEHOLDER, DATE_PLACEHOLDER);
    renderText(dataPrevistaEl, DATE_PLACEHOLDER, DATE_PLACEHOLDER);
    updateDeadline(null, null);
    renderText(modelEl, MODEL_PLACEHOLDER, MODEL_PLACEHOLDER);
    if (loteEl) {
      loteEl.innerHTML = 'Sem Lote';
    }

function getPs2ActivePriorityPercentage(table, row, activePriority) {
  const priorityNumber = Number(String(activePriority == null ? '' : activePriority).trim());
  if (!Number.isInteger(priorityNumber) || priorityNumber < 1) return null;

  const startIndex = columnLetterToIndex('AL');
  const endIndex = columnLetterToIndex('CE');
  const targetHeader = normalizeString(`P${priorityNumber}`);
  for (let index = startIndex; index <= endIndex && index + 1 < table.cols.length; index += 1) {
    const header = normalizeString(table.cols[index].label || table.cols[index].id || '');
    if (header !== targetHeader) continue;

    const percentageHeader = normalizeString(table.cols[index + 1].label || table.cols[index + 1].id || '');
    if (percentageHeader !== '%') return null;

    const rawPercentage = getValueFromRow(row, index + 1);
    if (rawPercentage == null || String(rawPercentage).trim() === '') return null;
    const percentage = parseSheetPercentage(rawPercentage);
    return percentage != null && percentage !== 100 ? percentage : null;
  }
  return null;
}

// Prioridades com progresso calculado pelo tempo decorrido (horas de turno).
// Os inícios vêm de DX:EW; os tempos previstos, de EX:FW; done = % da prioridade (100% fecha).
const TIMED_PRIORITIES = {
  '0.1': { done: 'AM' },
  '0.2': { done: 'AO' },
  '11.1': { done: 'BO' },
  '11.2': { done: 'BQ' },
  '11.3': { done: 'BS' },
};

const TIMED_PRIORITY_SUFFIXES = [
  '0,1', '0,2', '0,3', '1', '2', '3', '4', '5', '6', '7.1', '7.2', '8', '9',
  '10', '11,1', '11,2', '11,3', '12,1', '12,2', '12,3', '13,1', '13,2', '13,3',
  '14', '15', '16',
];

function getTimedPriorityKey(prioridade) {
  const n = Number(String(prioridade == null ? '' : prioridade).trim().replace(',', '.'));
  if (!Number.isFinite(n)) return null;
  const key = n.toFixed(1);
  return TIMED_PRIORITIES[key] ? key : null;
}

function getTimedPriorityValue(table, priorityKey, prefix) {
  const headerRow = table && table.rows && table.rows[0];
  const valueRow = table && table.rows && table.rows[1];
  if (!headerRow || !valueRow) return null;

  const targetHeader = `${prefix}${priorityKey.replace('.', ',')}`;
  const headerIndex = headerRow.c.findIndex(cell =>
    String(cell && (cell.v != null ? cell.v : cell.f) || '').trim().toUpperCase() === targetHeader
  );
  const index = headerIndex >= 0 ? headerIndex : TIMED_PRIORITY_SUFFIXES.indexOf(priorityKey.replace('.', ','));
  return index >= 0 ? getValueFromRow(valueRow, index) : null;
}

// Hora de início → Date. Formato normal: "2026/10/21 16:04:01". Aceita também "09:30:00", "Date(y,m,d,h,mi,s)",
// [h,mi,s] (timeofday), "14:00" ou fração do dia.
// Se só houver hora, assume o dia de hoje.
function parsePriorityStart(value, now = new Date()) {
  if (value == null || String(value).trim() === '') return null;
  const atToday = (h, mi, sec) => {
    const d = new Date(now);
    d.setHours(h, mi, sec || 0, 0);
    return d;
  };
  if (Array.isArray(value)) return atToday(Number(value[0]) || 0, Number(value[1]) || 0, Number(value[2]) || 0);
  if (typeof value === 'number') {
    if (value >= 0 && value < 1) return atToday(0, Math.round(value * 24 * 60), 0);
    return null;
  }
  const text = String(value).trim();
  const dt = text.match(/^Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+)(?:,(\d+))?)?\)$/);
  if (dt) {
    const [, y, m, d, h, mi, sec] = dt.map(Number);
    if (y < 1900) return atToday(h || 0, mi || 0, sec || 0); // só hora (base 1899-12-30)
    return new Date(y, m, d, h || 0, mi || 0, sec || 0);
  }
  const iso = text.match(/^(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})[\sT]+(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
  if (iso) {
    const [, y, m, d, h, mi, sec] = iso.map(Number);
    return new Date(y, m - 1, d, h, mi, sec || 0);
  }
  const full = text.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})\s+(\d{1,2})[:h](\d{2})(?::(\d{2}))?$/);
  if (full) {
    const [, d, m, y, h, mi, sec] = full.map(Number);
    return new Date(y, m - 1, d, h, mi, sec || 0);
  }
  const time = text.match(/^(\d{1,2})[:h](\d{2})?(?::(\d{2}))?$/i);
  if (time) return atToday(Number(time[1]), Number(time[2] || 0), Number(time[3] || 0));
  return null;
}

// Duração estimada → horas. Aceita "04:00:00", número de horas (4 / "4,5"), "4h30" ou [h,mi,s].
function parsePriorityDurationHours(value) {
  if (value == null || String(value).trim() === '') return null;
  if (Array.isArray(value)) return (Number(value[0]) || 0) + (Number(value[1]) || 0) / 60 + (Number(value[2]) || 0) / 3600;
  if (typeof value === 'number') return value > 0 ? value : null;
  const text = String(value).trim();
  const dt = text.match(/^Date\(\d+,\d+,\d+,(\d+),(\d+)(?:,(\d+))?\)$/);
  if (dt) return Number(dt[1]) + Number(dt[2]) / 60 + Number(dt[3] || 0) / 3600;
  const hm = text.match(/^(\d+)\s*[:h]\s*(\d{1,2})?(?::(\d{2}))?$/i);
  if (hm) return Number(hm[1]) + Number(hm[2] || 0) / 60 + Number(hm[3] || 0) / 3600;
  const n = Number(text.replace(',', '.'));
  return Number.isFinite(n) && n > 0 ? n : null;
}

// Turnos de trabalho (minutos desde a meia-noite): 08:00–13:00 e 14:00–17:15.
const PRIORITY_SHIFTS = [[8 * 60, 13 * 60], [14 * 60, 17 * 60 + 15]];

// Horas de turno decorridas entre `start` e `now`, só em dias úteis.
function getPriorityShiftHours(start, now) {
  if (!(start < now)) return 0;
  const minutesOf = d => d.getHours() * 60 + d.getMinutes() + d.getSeconds() / 60;
  const firstDay = new Date(start); firstDay.setHours(0, 0, 0, 0);
  const lastDay = new Date(now); lastDay.setHours(0, 0, 0, 0);
  let minutes = 0;
  for (const day = new Date(firstDay); day <= lastDay; day.setDate(day.getDate() + 1)) {
    if (getWorkDaysCount(day, day, true, day.getFullYear()) !== 1) continue;
    const from = day.getTime() === firstDay.getTime() ? minutesOf(start) : 0;
    const to = day.getTime() === lastDay.getTime() ? minutesOf(now) : 24 * 60;
    PRIORITY_SHIFTS.forEach(([a, b]) => {
      minutes += Math.max(0, Math.min(to, b) - Math.max(from, a));
    });
  }
  return minutes / 60;
}

// Duração dividida em 6 partes: cada parte de horas de turno decorrida soma 1/6, até 5/6.
// A última parte só entra quando a % da prioridade na Sheet (AM2/AO2) = 100%.
function computeTimedPriorityPct(info, now = new Date()) {
  if (!info) return null;
  if (info.donePct === 100) return 100;
  const start = parsePriorityStart(info.start, now);
  const hours = parsePriorityDurationHours(info.duration);
  if (!start || !hours) return 0;
  const parts = Math.floor(getPriorityShiftHours(start, now) / (hours / 6));
  return Math.round(Math.min(5, parts) * (100 / 6) * 10) / 10;
}

async function fetchPs2Summary() {
  const table = await fetchSecondaryTable('PS2');
  const row = table && Array.isArray(table.rows) ? table.rows[0] : null;
  const readValue = (header, column) => {
    const index = findSheetCell(table, header, column);
    return index >= 0 ? getValueFromRow(row, index) : null;
  };
  const prioridadeAtiva = readValue('Posto2', 'CP');
  const timedKey = getTimedPriorityKey(prioridadeAtiva);
  let timedInfo = null;
  if (timedKey) {
    const cols = TIMED_PRIORITIES[timedKey];
    const [startTable, durationTable] = await Promise.all([
      fetchSheetTable({ id: SHEET_CONFIG_DEFAULT.id, tab: 'PS2', range: 'DX1:EW2' }),
      fetchSheetTable({ id: SHEET_CONFIG_DEFAULT.id, tab: 'PS2', range: 'EX1:FW2' }),
    ]);
    timedInfo = {
      start: getTimedPriorityValue(startTable, timedKey, 'T'),
      duration: getTimedPriorityValue(durationTable, timedKey, 'TP'),
      donePct: parseSheetPercentage(readValue(null, cols.done)),
    };
  }
  return {
    prioridadeAtiva,
    prioridadeAtivaPct: timedInfo
      ? computeTimedPriorityPct(timedInfo)
      : getPs2ActivePriorityPercentage(table, row, prioridadeAtiva),
    timedInfo,
    geral: readValue('GERAL(T)', 'N'),
  };
}

/* ── BREAK VIDEO: playlist com crossfade entre vídeos ─────────────────
   Estratégia:
   - 2 elementos <video> empilhados (A e B) que alternam
   - showPlaylist() carrega vídeo 0 em A, fade-in do stage
   - Quando A está perto do fim (1.5s antes), pré-carrega vídeo 1 em B e arranca-o
     mudo, depois faz crossfade (B fica activo, A inactivo)
   - Após o último vídeo terminar, fade-out do stage
   - Tenta autoplay com som; se o browser bloquear, faz retry mudo
   - Disparo automático: 2x por dia em horário fixo Lisboa (09:55 e 15:55)
   - Clique no logo: dispara a playlist imediatamente (testes/demos)
*/
(function setupBreakVideo() {
  const stage = document.getElementById('breakVideoStage');
  const videoA = document.getElementById('breakVideoA');
  const videoB = document.getElementById('breakVideoB');
  if (!stage || !videoA || !videoB) return;

  const PLAYLIST = [
    // Cloudinary auto-optimization: qualidade automática + formato moderno (WebM/AV1
    // onde suportado) + limite de 720p de largura. Reduz substancialmente o peso
    // sem alteração visível em ecrãs até FullHD.
    'https://res.cloudinary.com/djxxk3ipz/video/upload/q_auto,f_auto,w_720/v1778168513/pikaso-untitled-project-2026-05-07_a2clz5.mp4',
  ];
  // Horários fixos Lisboa (HH, MM) em que a playlist deve aparecer
  const SCHEDULE_LISBON = [[9, 55], [13, 55]];
  const FADE_OUT_MS = 0;            // sem fade — desaparece imediato
  const CROSSFADE_MS = 1500;        // bate certo com transition .break-video

  let nextScheduleId = null;
  let crossfadePrepId = null;
  let fadeOutCleanupId = null;
  let isPlaying = false;

  function clearPending() {
    [nextScheduleId, crossfadePrepId, fadeOutCleanupId].forEach(id => {
      if (id != null) clearTimeout(id);
    });
    nextScheduleId = crossfadePrepId = fadeOutCleanupId = null;
  }

  // Tenta dar play com som; se autoplay com som falhar, faz fallback mudo
  function tryPlay(v) {
    v.muted = false;
    const p = v.play();
    if (p && typeof p.then === 'function') {
      p.catch(() => {
        v.muted = true;
        v.play().catch(() => {/* desiste em silêncio */});
      });
    }
  }

  // Ajusta a largura do stage ao ratio do vídeo activo (evita bandas pretas).
  function syncStageWidth(v) {
    if (v.videoWidth > 0 && v.videoHeight > 0) {
      const ratio = v.videoWidth / v.videoHeight;
      const heightPx = stage.offsetHeight;
      if (heightPx > 0) {
        stage.style.width = `${heightPx * ratio}px`;
      }
    }
  }
  videoA.addEventListener('loadedmetadata', () => {
    if (videoA.classList.contains('is-active')) syncStageWidth(videoA);
  });
  videoB.addEventListener('loadedmetadata', () => {
    if (videoB.classList.contains('is-active')) syncStageWidth(videoB);
  });

  function hideAndScheduleNext() {
    isPlaying = false;
    stage.classList.remove('is-visible');
    fadeOutCleanupId = setTimeout(() => {
      [videoA, videoB].forEach(v => {
        try {
          v.pause();
          v.removeAttribute('src');
          v.load();
          v.classList.remove('is-active');
          v.onended = null;
          v.ontimeupdate = null;
          v.onerror = null;
        } catch (e) {}
      });
      fadeOutCleanupId = null;
    }, FADE_OUT_MS);
    scheduleNextLisbon();
  }

  // Limpa todos os listeners/timers associados a um slot
  function detachSlot(slot) {
    slot.onended = null;
    slot.ontimeupdate = null;
    slot.onerror = null;
    slot.onpause = null;
  }

  // Watchdog: ID do timer global que força fade-out se nada acontecer
  let watchdogId = null;
  function clearWatchdog() {
    if (watchdogId != null) { clearTimeout(watchdogId); watchdogId = null; }
  }
  function armWatchdog(slot, onTimeout) {
    clearWatchdog();
    // Se metadata ainda não chegou, usa fallback de 60s
    const duration = Number.isFinite(slot.duration) && slot.duration > 0 ? slot.duration : 60;
    const remainingMs = (duration - (slot.currentTime || 0)) * 1000 + 5000; // +5s margem
    watchdogId = setTimeout(() => {
      watchdogId = null;
      console.warn('[break-video] watchdog: vídeo não terminou no tempo esperado, forçando fade-out');
      onTimeout();
    }, remainingMs);
  }

  // Toca o vídeo no índice i no slot dado (videoA ou videoB).
  function playSlot(slotCurrent, slotOther, i) {
    if (i >= PLAYLIST.length) {
      clearWatchdog();
      hideAndScheduleNext();
      return;
    }

    slotCurrent.classList.add('is-active');
    slotOther.classList.remove('is-active');
    detachSlot(slotCurrent);

    slotCurrent.src = PLAYLIST[i];
    slotCurrent.load();
    tryPlay(slotCurrent);
    syncStageWidth(slotCurrent);

    const nextIdx = i + 1;
    let advanced = false;
    function advance() {
      if (advanced) return;
      advanced = true;
      detachSlot(slotCurrent);
      clearWatchdog();
      playSlot(slotOther, slotCurrent, nextIdx);
    }

    // Quando metadata chegar, arma watchdog com a duração real
    slotCurrent.addEventListener('loadedmetadata', () => {
      armWatchdog(slotCurrent, advance);
    }, { once: true });
    // Watchdog inicial (caso metadata demore) — 60s genérico
    armWatchdog(slotCurrent, advance);

    if (nextIdx < PLAYLIST.length) {
      // Crossfade quando faltarem CROSSFADE_MS para o fim
      let crossfadeStarted = false;
      slotCurrent.ontimeupdate = () => {
        if (crossfadeStarted || advanced) return;
        const remaining = (slotCurrent.duration - slotCurrent.currentTime) * 1000;
        if (Number.isFinite(remaining) && remaining <= CROSSFADE_MS) {
          crossfadeStarted = true;
          slotCurrent.ontimeupdate = null;

          slotOther.src = PLAYLIST[nextIdx];
          slotOther.load();
          const startNext = () => {
            slotOther.removeEventListener('canplay', startNext);
            tryPlay(slotOther);
            slotOther.classList.add('is-active');
            slotCurrent.classList.remove('is-active');
            // Continua fluxo a partir do slotOther
            advanced = true;
            detachSlot(slotCurrent);
            clearWatchdog();
            // Chama playSlot mas sem trocar src (já está carregado), apenas para
            // armar watchdog e listeners no slotOther:
            playSlotContinue(slotOther, slotCurrent, nextIdx);
          };
          slotOther.addEventListener('canplay', startNext, { once: true });
        }
      };
    }

    // Eventos de término / falha — todos chamam advance() (que despacha conforme nextIdx)
    slotCurrent.onended = advance;
    slotCurrent.onerror = (e) => {
      console.warn('[break-video] erro no vídeo, a avançar:', e);
      advance();
    };
  }

  // Continua o fluxo para um slot que já foi carregado (usado depois do crossfade).
  // Diferença para playSlot: não troca o src nem chama load().
  function playSlotContinue(slotCurrent, slotOther, i) {
    if (i >= PLAYLIST.length) {
      clearWatchdog();
      hideAndScheduleNext();
      return;
    }
    detachSlot(slotCurrent);

    const nextIdx = i + 1;
    let advanced = false;
    function advance() {
      if (advanced) return;
      advanced = true;
      detachSlot(slotCurrent);
      clearWatchdog();
      playSlot(slotOther, slotCurrent, nextIdx);
    }

    armWatchdog(slotCurrent, advance);

    if (nextIdx < PLAYLIST.length) {
      let crossfadeStarted = false;
      slotCurrent.ontimeupdate = () => {
        if (crossfadeStarted || advanced) return;
        const remaining = (slotCurrent.duration - slotCurrent.currentTime) * 1000;
        if (Number.isFinite(remaining) && remaining <= CROSSFADE_MS) {
          crossfadeStarted = true;
          slotCurrent.ontimeupdate = null;
          slotOther.src = PLAYLIST[nextIdx];
          slotOther.load();
          const startNext = () => {
            slotOther.removeEventListener('canplay', startNext);
            tryPlay(slotOther);
            slotOther.classList.add('is-active');
            slotCurrent.classList.remove('is-active');
            advanced = true;
            detachSlot(slotCurrent);
            clearWatchdog();
            playSlotContinue(slotOther, slotCurrent, nextIdx);
          };
          slotOther.addEventListener('canplay', startNext, { once: true });
        }
      };
    }

    slotCurrent.onended = advance;
    slotCurrent.onerror = (e) => {
      console.warn('[break-video] erro no vídeo, a avançar:', e);
      advance();
    };
  }

  function showPlaylist() {
    nextScheduleId = null;
    isPlaying = true;
    stage.classList.add('is-visible');
    playSlot(videoA, videoB, 0);
  }

  // Trigger manual: clique no logo força a playlist agora (se não está a tocar)
  function triggerNow() {
    if (isPlaying) return;
    clearPending();
    [videoA, videoB].forEach(v => { try { v.pause(); } catch (e) {} });
    showPlaylist();
  }

  const logoEl = document.querySelector('.h-logo');
  if (logoEl) {
    logoEl.style.cursor = 'pointer';
    logoEl.addEventListener('click', triggerNow);
  }

  // ── Agendador: dispara nos horários SCHEDULE_LISBON, em hora de Lisboa ──
  // Tolerância de 60s: se o page load acontecer entre 09:55 e 09:56, ainda dispara.

  // Devolve "HH:MM" actual em Lisboa (string ZULU-safe).
  function nowLisbon() {
    const fmt = new Intl.DateTimeFormat('pt-PT', {
      timeZone: 'Europe/Lisbon',
      hour12: false,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
    });
    const parts = {};
    fmt.formatToParts(new Date()).forEach(p => { if (p.type !== 'literal') parts[p.type] = p.value; });
    return {
      // Date object representando este instante em Lisboa (mas montado como local)
      lisbonDate: new Date(`${parts.year}-${parts.month}-${parts.day}T${parts.hour}:${parts.minute}:${parts.second}`),
      h: parseInt(parts.hour, 10),
      m: parseInt(parts.minute, 10),
      s: parseInt(parts.second, 10),
    };
  }

  // Devolve { delayMs, justMissedRecent } para o próximo trigger horário.
  // Se um trigger ocorreu nos últimos 60s, dispara já (tolerância para reload).
  function nextLisbonTrigger() {
    const now = nowLisbon();
    const minutesNow = now.h * 60 + now.m + now.s / 60;
    const TOL_S = 60; // 60s de tolerância depois do horário

    // Verifica se algum horário ocorreu nos últimos 60s — se sim, dispara já
    for (const [hh, mm] of SCHEDULE_LISBON) {
      const target = hh * 60 + mm;
      const diffSec = (minutesNow - target) * 60; // segundos depois do horário
      if (diffSec >= 0 && diffSec <= TOL_S) {
        return { delayMs: 0, justMissed: true };
      }
    }

    // Caso contrário: encontra o próximo horário no futuro
    let bestDelay = Infinity;
    for (const [hh, mm] of SCHEDULE_LISBON) {
      const target = hh * 60 + mm;
      let deltaMin = target - minutesNow;
      if (deltaMin <= 0) deltaMin += 24 * 60; // amanhã
      if (deltaMin * 60 * 1000 < bestDelay) bestDelay = deltaMin * 60 * 1000;
    }
    return { delayMs: bestDelay, justMissed: false };
  }

  function scheduleNextLisbon() {
    if (nextScheduleId != null) clearTimeout(nextScheduleId);
    const { delayMs } = nextLisbonTrigger();
    nextScheduleId = setTimeout(() => {
      nextScheduleId = null;
      if (!isPlaying) showPlaylist();
      else scheduleNextLisbon(); // se ainda a tocar (improvável), tenta de novo
    }, delayMs);
  }

  scheduleNextLisbon();
})();

/* ── SYNC: prazo+details = altura do zonas-panel ── */
(function syncRightHeights() {
  const zonas = document.querySelector('.zonas-panel');
  const prazo = document.querySelector('.prazo-section');
  const details = document.querySelector('.details-section');
  if (!zonas || !prazo || !details) return;

  // box-sizing: border-box garante que height inclui padding
  prazo.style.boxSizing = 'border-box';
  details.style.boxSizing = 'border-box';

  function applyHeight() {
    const total = zonas.getBoundingClientRect().height;
    if (total <= 0) return;
    // Split: 65% prazo / 25% details — soma 90% do zonas-panel (10% libertado)
    prazo.style.height = `${total * 0.65}px`;
    details.style.height = `${total * 0.25}px`;
  }

  // Aplica imediatamente e ao redimensionar
  applyHeight();
  window.addEventListener('resize', applyHeight);
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(applyHeight).observe(zonas);
  }
})();

/* ── THREE.JS GLOBE ── */
(function() {
  const container = document.getElementById('globeContainer');
  const W = container.offsetWidth;
  const H = container.offsetHeight;

  const scene    = new THREE.Scene();
  const camera   = new THREE.PerspectiveCamera(45, W / H, 0.1, 2000);
  camera.position.set(0, 30, 380);
  camera.lookAt(0, 0, 0);

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setClearColor(0x000000, 0);
  container.appendChild(renderer.domElement);

  const RADIUS = 140 * 0.96;
  const globeGroup = new THREE.Group();
  scene.add(globeGroup);

  // Luzes (afectam apenas materiais que reagem a luz — Phong/Standard/etc.
  // O globo e a atmosfera usam BasicMaterial/ShaderMaterial, ficam intactos)
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
  dirLight.position.set(120, 180, 200);
  scene.add(dirLight);
  const fillLight = new THREE.DirectionalLight(0x88aaff, 0.35);
  fillLight.position.set(-150, -80, -100);
  scene.add(fillLight);

  // ── SHADERS ──
  const globeVS = `
    varying vec3 vNormal;
    varying vec2 vUv;
    void main() {
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      vNormal = normalize(normalMatrix * normal);
      vUv = uv;
    }`;
  const globeFS = `
    uniform sampler2D globeTexture;
    varying vec3 vNormal;
    varying vec2 vUv;
    void main() {
      vec3 diffuse = texture2D(globeTexture, vUv).xyz * 0.8;
      float intensity = 1.05 - dot(vNormal, vec3(0.0,0.0,1.0));
      vec3 atmosphere = vec3(1.0,1.0,1.0) * pow(intensity, 3.0) * 0.4;
      gl_FragColor = vec4(diffuse + atmosphere, 1.04);
    }`;

  const atmVS = `
    varying vec3 vNormal;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`;
  const atmFS = `
    varying vec3 vNormal;
    void main() {
      float intensity = pow(0.7 - dot(vNormal, vec3(0.0,0.0,1.0)), 4.0);
      gl_FragColor = vec4(1.0,1.0,1.0,1.0) * intensity;
    }`;

  // ── GLOBE SPHERE with texture ──
  const loader   = new THREE.TextureLoader();
  const EARTH_TX = 'https://res.cloudinary.com/djxxk3ipz/image/upload/v1776693284/WhatsApp_Image_2025-11-16_at_11.26.19_ssekf5.jpg';

  const globeGeo = new THREE.SphereGeometry(RADIUS, 64, 64);
  const globeMat = new THREE.ShaderMaterial({
    uniforms: { globeTexture: { value: null } },
    vertexShader: globeVS,
    fragmentShader: globeFS,
    blending: THREE.AdditiveBlending,
    transparent: true,
  });

  loader.load(EARTH_TX, (tex) => {
    tex.minFilter = THREE.LinearFilter;
    tex.magFilter = THREE.LinearFilter;
    globeMat.uniforms.globeTexture.value = tex;
    globeMat.needsUpdate = true;
  }, undefined, () => {
    globeMat.fragmentShader = `
      varying vec3 vNormal;
      void main() {
        float i = 1.05 - dot(vNormal, vec3(0,0,1));
        vec3 atm = vec3(0.05,0.2,0.5) * pow(i,2.5);
        gl_FragColor = vec4(vec3(0.02,0.06,0.14) + atm, 0.95);
      }`;
    globeMat.needsUpdate = true;
  });

  const globeMesh = new THREE.Mesh(globeGeo, globeMat);
  globeGroup.add(globeMesh);

  // Esfera interior escura — dá densidade visual ao globo (compensa o additive blending
  // do material principal, que tende a deixar passar o fundo). Ligeiramente menor que
  // a esfera do mapa para nunca aparecer por fora.
  const innerSphereMesh = new THREE.Mesh(
    new THREE.SphereGeometry(RADIUS * 0.985, 48, 48),
    new THREE.MeshBasicMaterial({
      color: 0x020610,        // azul-marinho muito escuro, quase preto
      transparent: true,
      opacity: 0.95,
      depthWrite: true,
    })
  );
  globeGroup.add(innerSphereMesh);

  // ── ATMOSPHERE ──
  const atmMesh = new THREE.Mesh(
    new THREE.SphereGeometry(RADIUS, 64, 64),
    new THREE.ShaderMaterial({
      vertexShader: atmVS,
      fragmentShader: atmFS,
      blending: THREE.AdditiveBlending,
      side: THREE.BackSide,
      transparent: true,
    })
  );
  atmMesh.scale.set(1.2, 1.2, 1.2);
  globeGroup.add(atmMesh);

  // ── DISC TEXTURE ──
  function makeDiscTexture() {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,   'rgba(255,255,255,1)');
    g.addColorStop(0.4, 'rgba(255,255,255,0.9)');
    g.addColorStop(1,   'rgba(255,255,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(32,32,32,0,Math.PI*2); ctx.fill();
    const t = new THREE.CanvasTexture(c);
    return t;
  }

  // ── DOTS grid ──
  function toXYZ(lat, lon, r) {
    const phi   = (90 - lat)  * Math.PI / 180;
    const theta = (180 - lon) * Math.PI / 180;
    return new THREE.Vector3(
      -r * Math.sin(phi) * Math.cos(theta),
      -r * Math.cos(phi),
      -r * Math.sin(phi) * Math.sin(theta)
    );
  }

  function coordToPos(lat, lon, r) {
    const phi   = (90 - lat)  * Math.PI / 180;
    const theta = (180 - lon) * Math.PI / 180;
    return new THREE.Vector3(
      -r * Math.sin(phi) * Math.cos(theta),
       r * Math.cos(phi),
      -r * Math.sin(phi) * Math.sin(theta)
    );
  }

  const dotR   = RADIUS + RADIUS * 0.025;
  const posArr = [];
  for (let lat = -80; lat <= 80; lat += 5) {
    const cols = Math.round(Math.cos(lat * Math.PI / 180) * 36);
    for (let i = 0; i < cols; i++) {
      const lon = (i / cols) * 360 - 180;
      const p   = toXYZ(lat, lon, dotR);
      posArr.push(p.x, p.y, p.z);
    }
  }
  const dotGeo = new THREE.BufferGeometry();
  dotGeo.setAttribute('position', new THREE.Float32BufferAttribute(posArr, 3));
  const dotMat = new THREE.PointsMaterial({
    color: 0x05d5fa,
    size: 2.2,
    map: makeDiscTexture(),
    transparent: true,
    opacity: 0.8,
    alphaTest: 0.05,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  globeGroup.add(new THREE.Points(dotGeo, dotMat));

  // ── MARKERS ──
  function addMarker(lat, lon, color) {
    const pos  = coordToPos(lat, lon, RADIUS + 3);
    const group = new THREE.Group();
    group.position.copy(pos);

    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(3.5, 12, 12),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.95 })
    );
    group.add(mesh);

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(5, 7.5, 24),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.5, side: THREE.DoubleSide })
    );
    ring.lookAt(new THREE.Vector3(0,0,0));
    group.add(ring);

    globeGroup.add(group);
    return group;
  }

  // Cria a geometria de um pushpin 3D (esfera + haste cilíndrica + ponta cónica).
  // Construído com a ponta na origem, esfera ao longo de +Y. Cacheado por chave de cor.
  const PUSHPIN_CACHE = {};
  function getPushpin(headColor, shaftColor) {
    const key = `${headColor}|${shaftColor}`;
    if (PUSHPIN_CACHE[key]) return PUSHPIN_CACHE[key].clone();

    // Dimensões (proporcionais — pin discreto). RADIUS≈134, então mantemos pequeno.
    const headR = 4.5;
    const shaftLen = 9;
    const shaftR = 0.7;
    const tipLen = 1.8;

    const group = new THREE.Group();

    // Ponta (cone) — na origem, a apontar para -Y
    const tipGeo = new THREE.ConeGeometry(shaftR, tipLen, 12);
    const tipMesh = new THREE.Mesh(tipGeo, new THREE.MeshPhongMaterial({
      color: shaftColor, shininess: 80, specular: 0x666666,
    }));
    // ConeGeometry tem ponta em +Y por defeito; queremos ponta em -Y
    tipMesh.rotation.x = Math.PI;
    tipMesh.position.y = tipLen / 2;
    group.add(tipMesh);

    // Haste (cilindro)
    const shaftGeo = new THREE.CylinderGeometry(shaftR, shaftR, shaftLen, 16);
    const shaftMesh = new THREE.Mesh(shaftGeo, new THREE.MeshPhongMaterial({
      color: shaftColor, shininess: 80, specular: 0x666666,
    }));
    shaftMesh.position.y = tipLen + shaftLen / 2;
    group.add(shaftMesh);

    // Esfera (cabeça)
    const headGeo = new THREE.SphereGeometry(headR, 24, 18);
    const headMesh = new THREE.Mesh(headGeo, new THREE.MeshPhongMaterial({
      color: headColor, shininess: 50, specular: 0x222222,
    }));
    headMesh.position.y = tipLen + shaftLen + headR * 0.85; // ligeira sobreposição com a haste
    group.add(headMesh);

    PUSHPIN_CACHE[key] = group;
    return group.clone();
  }

  // Marcador em forma de pushpin 3D. A ponta fica nas coords (lat, lon)
  // e o pin orienta-se radialmente para fora (cabeça para o céu, ponta no globo).
  function add3DPinMarker(lat, lon, headColor, shaftColor) {
    const tipPos = coordToPos(lat, lon, RADIUS + 0.2);
    const outwardDir = tipPos.clone().normalize();

    const pin = getPushpin(headColor, shaftColor || '#cfd2d6');

    pin.position.copy(tipPos);
    const upLocal = new THREE.Vector3(0, 1, 0);
    pin.quaternion.setFromUnitVectors(upLocal, outwardDir);

    pin.renderOrder = 999;
    globeGroup.add(pin);
    return pin;
  }
  // Marcadores iniciais — Portugal como pushpin (esfera branca, haste cinzenta)
  let ptRing = add3DPinMarker(38.7, -9.1, '#ffffff', '#b8bcc2');
  let destRings = [];

  // Atualiza marcadores de destino. Aceita uma lista de nomes de países (ou um único string,
  // por compatibilidade com a API antiga). Países repetidos são ignorados.
  function updateGlobeDestinations(countries) {
    const list = Array.isArray(countries) ? countries : (countries ? [countries] : []);

    // Remover marcadores antigos
    destRings.forEach(g => globeGroup.remove(g));
    destRings = [];

    // Deduplicar (case-insensitive, ignorando acentos)
    const seen = new Set();
    list.forEach(name => {
      if (!name) return;
      const key = String(name).trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
      if (key === '' || seen.has(key)) return;
      seen.add(key);
      const coords = getCountryCoordinates(name);
      if (!coords) return;
      destRings.push(addMarker(coords.lat, coords.lon, 0x00ff87));
    });
  }
  // Wrapper de compatibilidade — código antigo ainda chama updateGlobeDestination(country)
  function updateGlobeDestination(country) {
    updateGlobeDestinations(country);
  }
  window.updateGlobeDestinations = updateGlobeDestinations;
  window.updateGlobeDestination = updateGlobeDestination;

  // O destino do globo será atualizado a partir de renderSheetData()

  globeGroup.rotation.y = THREE.MathUtils.degToRad(-(180 - 9.1));
  globeGroup.rotation.x = THREE.MathUtils.degToRad(20);

  let isRotating    = false;
  let rotStart      = 0;
  let rotStartAngle = 0;
  const ROT_DUR     = 8000;

  setInterval(() => {
    if (isRotating) return;
    isRotating    = true;
    rotStart      = Date.now();
    rotStartAngle = globeGroup.rotation.y;
  }, 5 * 60 * 1000);

  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.008;

    const p = 0.88 + 0.18 * Math.sin(t * 3);
    // Pin de Portugal (3D) sem animação — só os marcadores de destino pulsam
    destRings.forEach(r => r.scale.set(p, p, 1));

    if (!isRotating) globeGroup.rotation.y -= 0.0015;

    if (isRotating) {
      const elapsed  = Date.now() - rotStart;
      const progress = Math.min(elapsed / ROT_DUR, 1);
      const ease     = progress < 0.5 ? 2*progress*progress : -1+(4-2*progress)*progress;
      globeGroup.rotation.y = rotStartAngle + ease * Math.PI * 2;
      if (progress >= 1) { globeGroup.rotation.y = rotStartAngle; isRotating = false; }
    }

    renderer.render(scene, camera);
  }
  animate();

  // Resize com ResizeObserver — mais robusto do que window.resize
  // (dispara também quando o layout do grid muda, não só quando a janela muda)
  const ro = new ResizeObserver(() => {
    const W2 = container.offsetWidth, H2 = container.offsetHeight;
    if (W2 === 0 || H2 === 0) return;
    camera.aspect = W2 / H2;
    camera.updateProjectionMatrix();
    renderer.setSize(W2, H2);
  });
  ro.observe(container);
})();
</script>
